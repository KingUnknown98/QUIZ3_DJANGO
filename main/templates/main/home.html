<!DOCTYPE html>
<html>

<head>
    <title>Home</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f6f8;
        }

        .container {
            box-sizing: border-box;
            width: min(90%, 700px);
            padding: 40px;
            text-align: center;
            background: white;
            border: 1px solid #d5dbe0;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgb(0 0 0 / 10%);
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Hello World!</h1>

        <h2>Welcome to my Website</h2>
        <h3>This is a simple simple Django web application that demonstrates the basic connection between:
Model → View → URL → Template</h3>

        <a href="{% url 'students_list' %}">View Students</a>
    </main>
</body>

</html>
